<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <clipPath id="avatarClip">
      <circle cx="200" cy="200" r="180" />
    </clipPath>
  </defs>

  <!-- Ambient Outer Halo -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#primaryGlow)" stroke-width="3" opacity="0.6" />
  <circle cx="200" cy="200" r="192" fill="none" stroke="url(#accentGlow)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />

  <g clip-path="url(#avatarClip)">
    <!-- Base Background Circle -->
    <rect width="400" height="400" fill="url(#bgGrad)" />

    <!-- Cyber / Code Grid background lines -->
    <g opacity="0.15" stroke="#6366f1" stroke-width="1">
      <line x1="50" y1="0" x2="50" y2="400" />
      <line x1="100" y1="0" x2="100" y2="400" />
      <line x1="150" y1="0" x2="150" y2="400" />
      <line x1="200" y1="0" x2="200" y2="400" />
      <line x1="250" y1="0" x2="250" y2="400" />
      <line x1="300" y1="0" x2="300" y2="400" />
      <line x1="350" y1="0" x2="350" y2="400" />
      <line x1="0" y1="60" x2="400" y2="60" />
      <line x1="0" y1="120" x2="400" y2="120" />
      <line x1="0" y1="180" x2="400" y2="180" />
      <line x1="0" y1="240" x2="400" y2="240" />
      <line x1="0" y1="300" x2="400" y2="300" />
      <line x1="0" y1="360" x2="400" y2="360" />
    </g>

    <!-- Glowing Ambient Orbs behind character -->
    <circle cx="100" cy="120" r="80" fill="#6366f1" opacity="0.3" filter="url(#glowEffect)" />
    <circle cx="310" cy="220" r="90" fill="#38bdf8" opacity="0.25" filter="url(#glowEffect)" />

    <!-- Shoulders & Hoodie -->
    <path d="M70 410 C 80 320, 130 290, 200 290 C 270 290, 320 320, 330 410 Z" fill="url(#hoodieGrad)" />
    <!-- Hoodie Seams / Highlights -->
    <path d="M125 310 C 160 330, 180 370, 185 410" stroke="#38bdf8" stroke-width="2" opacity="0.5" fill="none" />
    <path d="M275 310 C 240 330, 220 370, 215 410" stroke="#818cf8" stroke-width="2" opacity="0.5" fill="none" />
    <path d="M165 315 L 200 360 L 235 315" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <path d="M195 345 L 195 395 M 205 345 L 205 395" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

    <!-- Neck -->
    <rect x="175" y="240" width="50" height="60" rx="10" fill="#f59e0b" />
    <path d="M175 255 C 190 270, 210 270, 225 255 L 225 285 L 175 285 Z" fill="#d97706" opacity="0.4" />

    <!-- Head / Face -->
    <path d="M145 180 C 145 130, 160 110, 200 110 C 240 110, 255 130, 255 180 C 255 240, 235 260, 200 260 C 165 260, 145 240, 145 180 Z" fill="#fbbf24" />

    <!-- Ears -->
    <circle cx="145" cy="185" r="14" fill="#f59e0b" />
    <circle cx="255" cy="185" r="14" fill="#f59e0b" />
    <!-- Small tech ear cuff / wireless earbud -->
    <rect x="261" y="180" width="4" height="12" rx="2" fill="#38bdf8" filter="url(#glowEffect)" />

    <!-- Hair -->
    <path d="M140 160 C 135 120, 160 85, 200 85 C 240 85, 265 110, 265 155 C 265 160, 250 135, 240 135 C 225 135, 220 145, 195 130 C 175 140, 155 140, 140 160 Z" fill="url(#hairGrad)" />
    <!-- Stylized Modern Quiff Strand -->
    <path d="M160 100 C 185 75, 230 75, 250 95 C 235 90, 205 90, 185 105 Z" fill="#475569" />

    <!-- Modern Smart Glasses -->
    <!-- Frame -->
    <rect x="150" y="165" width="42" height="28" rx="8" fill="none" stroke="#1e293b" stroke-width="4" />
    <rect x="208" y="165" width="42" height="28" rx="8" fill="none" stroke="#1e293b" stroke-width="4" />
    <path d="M192 176 L 208 176" stroke="#1e293b" stroke-width="4" />
    <path d="M145 174 L 150 174 M 250 174 L 255 174" stroke="#1e293b" stroke-width="3" />
    <!-- Glass Lenses with Cyan/Purple Reflection -->
    <rect x="152" y="167" width="38" height="24" rx="6" fill="url(#glassGrad)" />
    <rect x="210" y="167" width="38" height="24" rx="6" fill="url(#glassGrad)" />
    <line x1="156" y1="184" x2="174" y2="170" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linecap="round" />
    <line x1="214" y1="184" x2="232" y2="170" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linecap="round" />

    <!-- Eyes (behind glasses) -->
    <circle cx="171" cy="179" r="4" fill="#0f172a" />
    <circle cx="229" cy="179" r="4" fill="#0f172a" />
    <circle cx="173" cy="177" r="1.5" fill="#ffffff" />
    <circle cx="231" cy="177" r="1.5" fill="#ffffff" />

    <!-- Eyebrows -->
    <path d="M154 156 Q 170 152 186 158" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M214 158 Q 230 152 246 156" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Nose -->
    <path d="M200 185 L 197 203 L 204 203" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Confident Smile -->
    <path d="M185 220 Q 200 234 215 220" stroke="#92400e" stroke-width="3" stroke-linecap="round" fill="none" />
    
    <!-- Code / Matrix floating symbols in foreground -->
    <g font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8" opacity="0.8">
      <text x="45" y="160">&lt;div&gt;</text>
      <text x="320" y="140">{MERN}</text>
      <text x="55" y="270">=&gt;</text>
      <text x="315" y="280">&lt;/&gt;</text>
    </g>

    <!-- Laptop Screen Glow from bottom -->
    <polygon points="110,400 290,400 260,370 140,370" fill="url(#primaryGlow)" opacity="0.5" filter="url(#glowEffect)" />
  </g>
</svg>
